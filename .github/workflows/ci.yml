name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    name: Tipos y tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests de cálculos
        run: npm test
      - name: Tests de base de datos (migraciones, RLS, RPC)
        run: npm run test:sql
